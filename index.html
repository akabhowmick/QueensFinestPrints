<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="76x76" href="/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#101014" />
    <meta name="theme-color" content="#FCFBF7" />

    <!-- Google fonts: preloaded here, attached as a stylesheet by
         src/theme/loadFonts.ts so it never blocks first render. Only the
         weights the design uses (Fraunces 600, Archivo 400/500/600). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queens Finest Prints</title>
    <meta
      name="description"
      content="Queens Finest Prints Website! We sell all types of custom 3D printed goods, including sports memorabilia to unique eye-catching desk toppers. You can securely buy directly through the our website or check our Etsy or Ebay pages. "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
